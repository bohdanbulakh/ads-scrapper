name: ads-scrapper

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-adds-scrapper}-postgres
    restart: unless-stopped
    # Values come from the root `.env` (see `.env.example`). The postgres image
    # reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB on first boot to
    # create the superuser and the initial database.
    env_file:
      - .env
    ports:
      # Only the host port is configurable; the server always listens on 5432
      # inside the compose network.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - adds-scrapper

  redis:
    image: redis:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-adds-scrapper}-redis
    restart: unless-stopped
    env_file:
      - .env
    # The redis image has no REDIS_PASSWORD convention, so the password is
    # passed explicitly. `:?` fails the run early if it is missing from `.env`.
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required — copy .env.example to .env}',
        '--appendonly',
        'yes',
      ]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - adds-scrapper

  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-adds-scrapper}-minio
    restart: unless-stopped
    env_file:
      - .env
    # The image reads MINIO_ROOT_USER / MINIO_ROOT_PASSWORD to create the
    # initial credentials; the app authenticates with the same pair via S3_*.
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      # 9000 is the S3 API, 9001 the web console.
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - adds-scrapper

  # --- Web UIs / bootstrap -----------------------------------------------------

  # Bull Board — dashboard for the BullMQ queues (waiting/active/failed job
  # lists, payloads, stack traces, retry & clean actions). It finds the queues
  # by SCANning redis for `<BULL_PREFIX>:*` keys, so new queues show up without
  # being registered here. The image ships bullmq 6.x, matching the app.
  bull-board:
    image: venatum/bull-board:latest
    container_name: ${COMPOSE_PROJECT_NAME:-adds-scrapper}-bull-board
    restart: unless-stopped
    # Deliberately no `env_file: .env`: REDIS_HOST there is `localhost`, which is
    # correct for the app on the host but wrong from inside the compose network.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — copy .env.example to .env}
      REDIS_DB: ${REDIS_DB:-0}
      # BullMQ (not the legacy `bull`), with BullMQ's default key prefix.
      BULL_VERSION: BULLMQ
      BULL_PREFIX: bull
      BULL_BOARD_TITLE: ads-scrapper queues
      PORT: 3000
      # Optional basic auth — the login page only appears when both are set.
      USER_LOGIN: ${BULL_BOARD_USER:-}
      USER_PASSWORD: ${BULL_BOARD_PASSWORD:-}
    ports:
      # 3000 inside; published on 3001 by default so it does not clash with the
      # Nest app running on the host.
      - '${BULL_BOARD_PORT:-3001}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - adds-scrapper

  # One-shot bucket bootstrap. MinIO's own console at :9001 is the S3 browser,
  # but it only lists buckets that already exist, and nothing else creates
  # S3_BUCKET — the app assumes it is there. Exits as soon as the bucket is up.
  minio-init:
    image: minio/mc:latest
    container_name: ${COMPOSE_PROJECT_NAME:-adds-scrapper}-minio-init
    restart: 'no'
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket '$$S3_BUCKET' is ready"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - adds-scrapper

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  adds-scrapper:
    driver: bridge
